<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>

  <body>
    <script>
      const params = new URLSearchParams(window.location.search);
      document.title = params.get("title") ?? "Echo URL Data";
      document.body.innerHTML = params.get("data") ?? "Echo URL Data";
    </script>
  </body>
</html>
