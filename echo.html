<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>

  <body>
    <script>
      document.title =
        new URLSearchParams(window.location.search).get("title") ?? "";

      document.body.innerHTML = decodeURIComponent(
        window.location.hash.slice(1),
      );
    </script>
  </body>
</html>
